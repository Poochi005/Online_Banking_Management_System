
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Banking Management System</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a35, #1265a8);
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      max-width: 650px;
      width: 100%;
      padding: 40px 25px;
      border: 1px solid #ffffff40;
      border-radius: 20px;
      background: #ffffff12;
      text-align: center;
    }
    h1 { font-size: 32px; }
    p { line-height: 1.7; color: #e0edff; }
    .features {
      text-align: left;
      display: inline-block;
      line-height: 2;
    }
    .button {
      display: inline-block;
      padding: 13px 22px;
      margin-top: 20px;
      border-radius: 8px;
      background: #ffffff;
      color: #073b70;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🏦 Online Banking Management System</h1>
    <p>Manage banking operations with our Java, JDBC and MySQL academic project.</p>
    <ul class="features">
      <li>Customer Account Management</li>
      <li>Deposit and Withdraw Money</li>
      <li>Fund Transfer</li>
      <li>Transaction History</li>
    </ul>
    <p>This is an academic demonstration website.</p>
    <a class="button"
       href="https://github.com/Poochi005/Online_Banking_Management_System">
       View Source Code
    </a>
  </main>
</body>
</html>
